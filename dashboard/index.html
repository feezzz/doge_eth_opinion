<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>狗哥行情分析面板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;background:#0a0e13;color:#c9d1d9;min-height:100vh}

a{color:#f0b90b;text-decoration:none}

/* ── topbar ── */
.topbar{
  background:linear-gradient(135deg,#0d1117 0%,#111820 100%);
  border-bottom:1px solid #21262d;
  padding:14px 24px;
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  position:sticky;top:0;z-index:10;
  backdrop-filter:blur(8px);
}
.topbar h1{font-size:20px;font-weight:700;color:#f0b90b;white-space:nowrap;letter-spacing:0.5px}
.topbar h1::before{content:'🐕 ';font-size:18px}
.topbar .meta{font-size:11px;color:#484f58;margin-left:4px}
.topbar .stats{display:flex;gap:8px;font-size:12px;margin-left:auto}
.topbar .stat-item{
  background:#0d1117;border:1px solid #21262d;
  padding:6px 14px;border-radius:6px;color:#8b949e;
  display:flex;align-items:center;gap:6px;
}
.topbar .stat-item .val{color:#e6edf3;font-weight:700;font-size:15px}
.topbar .stat-dot{width:6px;height:6px;border-radius:50%}
.topbar .stat-dot.entries{background:#f0b90b}
.topbar .stat-dot.symbols{background:#58a6ff}
.topbar .stat-dot.days{background:#3fb950}

/* ── pos widget ── */
.pos-widget{
  background:#0d1117;border:1px solid #21262d;border-radius:8px;
  padding:8px 16px;font-size:12px;display:flex;gap:14px;align-items:center;
}
.pos-widget .pos-label{color:#484f58;font-size:10px;text-transform:uppercase;letter-spacing:0.5px}
.pos-widget .pos-val{color:#e6edf3;font-weight:600;font-size:13px}
.pos-widget .pnl-pos{color:#3fb950;font-weight:700}
.pos-widget .pnl-neg{color:#f85149;font-weight:700}
.pos-widget .badge-empty{
  background:#1a0a0a;color:#f85149;padding:2px 8px;border-radius:3px;
  font-size:10px;font-weight:600;text-transform:uppercase;
}
.pos-widget .btn-hist{
  background:#21262d;border:1px solid #30363d;color:#8b949e;
  cursor:pointer;border-radius:4px;font-size:10px;padding:3px 10px;
  transition:all .15s;
}
.pos-widget .btn-hist:hover{background:#30363d;color:#e6edf3}

/* ── layout ── */
.layout{display:flex;height:calc(100vh - 64px)}
.sidebar{
  width:260px;background:#0d1117;border-right:1px solid #21262d;
  padding:20px 16px;overflow-y:auto;flex-shrink:0;
}
.main{flex:1;overflow-y:auto;padding:20px 28px 40px}

/* ── sidebar ── */
.sidebar h3{
  font-size:10px;color:#484f58;margin-bottom:10px;
  text-transform:uppercase;letter-spacing:1.5px;font-weight:600;
  display:flex;align-items:center;gap:6px;
}
.sidebar h3::after{content:'';flex:1;height:1px;background:#21262d}

.date-list{list-style:none;margin-bottom:24px}
.date-list li{
  padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px;
  color:#8b949e;transition:all .2s;display:flex;justify-content:space-between;
  align-items:center;margin-bottom:2px;
}
.date-list li:hover{background:#161b22;color:#e6edf3}
.date-list li.active{
  background:linear-gradient(135deg,#1f2a37 0%,#1a2330 100%);
  color:#f0b90b;font-weight:600;
  box-shadow:inset 3px 0 0 #f0b90b;
}
.date-list li .cnt{
  font-size:10px;color:#30363d;background:#161b22;
  padding:1px 6px;border-radius:3px;font-weight:500;
}
.date-list li.active .cnt{background:#2a1f0a;color:#d2991d}

.sym-filters{display:flex;flex-wrap:wrap;gap:5px}
.sym-chip{
  padding:5px 10px;border-radius:4px;font-size:11px;cursor:pointer;
  border:1px solid #21262d;color:#8b949e;background:transparent;
  transition:all .2s;font-weight:500;
}
.sym-chip:hover{border-color:#f0b90b;color:#e6edf3;background:#161b22}
.sym-chip.active{background:#f0b90b;color:#0d1117;border-color:#f0b90b;font-weight:700}
.sym-chip.eth{border-color:#3c2d0a}
.sym-chip.eth.active{background:#f0b90b;color:#0d1117}
.sym-chip.mu{border-color:#0a2a3a}
.sym-chip.mu.active{background:#58a6ff;border-color:#58a6ff;color:#0d1117}
.sym-chip.sndk{border-color:#1a0a2f}
.sym-chip.sndk.active{background:#bc8cff;border-color:#bc8cff;color:#0d1117}
.sym-chip.skhy{border-color:#0a2f1a}
.sym-chip.skhy.active{background:#3fb950;border-color:#3fb950;color:#0d1117}

/* ── search ── */
.search-bar{margin-bottom:20px;display:flex;gap:10px}
.search-bar input{
  flex:1;background:#0d1117;border:1px solid #21262d;
  border-radius:8px;padding:10px 16px;color:#e6edf3;font-size:13px;
  outline:none;transition:border-color .2s;
}
.search-bar input:focus{border-color:#f0b90b;box-shadow:0 0 0 3px rgba(240,185,11,0.08)}
.search-bar input::placeholder{color:#30363d}
.search-bar .search-info{font-size:11px;color:#484f58;align-self:center;white-space:nowrap}

/* ── day header ── */
.day-header{
  font-size:17px;font-weight:700;color:#f0b90b;margin-bottom:16px;
  padding-bottom:10px;border-bottom:1px solid #21262d;
  display:flex;align-items:center;gap:8px;
}
.day-header .day-dot{width:8px;height:8px;background:#f0b90b;border-radius:50%}

/* ── sym section ── */
.sym-section{margin-bottom:24px}
.sym-title{
  font-size:13px;font-weight:600;margin-bottom:10px;
  display:flex;align-items:center;gap:8px;color:#8b949e;
}
.sym-title .badge{
  padding:3px 10px;border-radius:4px;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:0.5px;
}
.sym-title .count{font-size:11px;color:#484f58}

.badge-eth{background:#2a1f0a;color:#f0b90b;border:1px solid #3c2d0a}
.badge-mu{background:#0a1f2a;color:#58a6ff;border:1px solid #0a2a3a}
.badge-sndk{background:#150a2a;color:#bc8cff;border:1px solid #1a0a2f}
.badge-skhy{background:#0a1f12;color:#3fb950;border:1px solid #0a2f1a}

/* ── card ── */
.card{
  background:#0d1117;border:1px solid #21262d;border-left:3px solid #30363d;
  border-radius:6px;padding:10px 14px;margin-bottom:8px;
  transition:all .2s;
}
.card:hover{border-color:#30363d;border-left-color:#484f58;background:#111820}
.card.eth{border-left-color:#f0b90b}
.card.mu{border-left-color:#58a6ff}
.card.sndk{border-left-color:#bc8cff}
.card.skhy{border-left-color:#3fb950}

.card-header{display:flex;align-items:center;gap:8px;margin-bottom:2px;flex-wrap:wrap}
.card-time{font-size:11px;color:#484f58;font-family:'SF Mono','Cascadia Code','Consolas',monospace}
.card-badge{
  font-size:9px;padding:1px 7px;border-radius:3px;font-weight:700;
  text-transform:uppercase;letter-spacing:0.3px;
}
.card-period{
  font-size:10px;background:#161b22;color:#8b949e;
  padding:1px 6px;border-radius:3px;font-family:monospace;
}
.card-summary{
  font-size:13px;color:#c9d1d9;line-height:1.5;
  padding-left:4px;margin-bottom:2px;
}
.card-body{
  font-size:13px;color:#8b949e;line-height:1.7;white-space:pre-line;
  display:none;margin-top:8px;padding:12px 14px;
  background:#080c10;border-radius:4px;
  border:1px solid #161b22;
  max-height:500px;overflow-y:auto;
}
.card-body.expanded{display:block}
.card-toggle{
  font-size:11px;color:#58a6ff;cursor:pointer;user-select:none;
  margin-top:2px;display:inline-block;transition:color .15s;
}
.card-toggle:hover{color:#79c0ff}

/* ── cards grid ── */
.cards-grid{display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:1400px){
  .cards-grid{grid-template-columns:1fr 1fr}
  .cards-grid .card:nth-child(odd){margin-right:4px}
  .cards-grid .card:nth-child(even){margin-left:4px}
}

/* ── search highlight ── */
mark.search-hl{background:#3c2d0a;color:#f0b90b;padding:0 2px;border-radius:2px}

/* ── summary doc ── */
.summary-doc{
  background:#0d1117;border:1px solid #21262d;border-radius:8px;
  padding:24px 28px;line-height:1.8;font-size:14px;
}
.summary-doc h2{color:#f0b90b;font-size:20px;margin-bottom:14px;font-weight:700}
.summary-doc h3{color:#e6edf3;font-size:15px;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid #21262d}
.summary-doc h4{color:#c9d1d9;font-size:13px;margin:12px 0 6px}
.summary-doc strong{color:#f0b90b;font-weight:600}
.summary-doc li{color:#8b949e;margin:2px 0 2px 16px}
.summary-doc pre{background:#080c10;padding:12px;border-radius:4px;overflow-x:auto;font-size:11px;color:#484f58;border:1px solid #161b22}
.summary-doc div{margin-bottom:10px}

/* ── empty ── */
.empty{text-align:center;padding:60px;color:#21262d;font-size:14px}
.empty::before{content:'📭';display:block;font-size:40px;margin-bottom:12px}

/* ── history table ── */
.history-table{width:100%;font-size:11px;border-collapse:collapse;margin-top:6px}
.history-table th{color:#484f58;text-align:left;padding:4px 10px;border-bottom:1px solid #21262d;font-weight:500}
.history-table td{color:#c9d1d9;padding:4px 10px}
.history-table tbody tr:hover{background:#161b22}

/* ── scrollbar ── */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#21262d;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#30363d}

/* ── mobile ── */
@media(max-width:768px){
  .layout{flex-direction:column}
  .sidebar{width:100%;border-right:none;border-bottom:1px solid #21262d;padding:12px}
  .date-list{display:flex;gap:4px;overflow-x:auto;flex-wrap:wrap}
  .date-list li{white-space:nowrap;font-size:12px}
  .topbar{padding:10px 14px}
  .topbar h1{font-size:16px}
  .main{padding:14px 16px}
}
</style>
</head>
<body>

<div class="topbar">
  <h1>狗哥行情分析面板</h1>
  <span class="meta" id="genTime"></span>
  <div class="stats">
    <div class="stat-item"><span class="stat-dot entries"></span>条目 <b class="val" id="statEntries">0</b></div>
    <div class="stat-item"><span class="stat-dot symbols"></span>品种 <b class="val" id="statSymbols">0</b></div>
    <div class="stat-item"><span class="stat-dot days"></span>天数 <b class="val" id="statDays">0</b></div>
  </div>
  <div class="pos-widget" id="posWidget"></div>
</div>

<div class="layout">
  <div class="sidebar">
    <h3>日期</h3>
    <ul class="date-list" id="dateList"></ul>
    <h3 style="margin-top:20px">品种</h3>
    <div class="sym-filters" id="symFilters"></div>
  </div>
  <div class="main">
    <div class="search-bar">
      <input type="text" placeholder="搜索：突破、破位、缩量、放量、支撑、压力、三线共振..." id="searchInput">
      <span class="search-info" id="searchInfo"></span>
    </div>
    <div id="content"></div>
  </div>
</div>

<script src="data.js?v=20260812112056"></script>
<script>
const DATA = window.APP_DATA;

const SYM_CLASS = {
  ETHUSDT: 'eth', MUUSDT: 'mu', SNDKUSDT: 'sndk', SKHYUSDT: 'skhy'
};
const SYM_BADGE = {
  ETHUSDT: 'badge-eth', MUUSDT: 'badge-mu', SNDKUSDT: 'badge-sndk', SKHYUSDT: 'badge-skhy'
};

// newest first
const DATES = DATA.meta.dates.slice().reverse();
let curDate = DATES[0];
let curSym = null;
let searchQ = '';

// ── topbar ──
document.getElementById('genTime').textContent = '更新 ' + DATA.generated_at;
document.getElementById('statEntries').textContent = DATA.meta.total_entries;
document.getElementById('statSymbols').textContent = DATA.meta.symbols.length;
document.getElementById('statDays').textContent = DATA.meta.dates.length;

// ── positions widget ──
(function() {
  var p = DATA.positions || {};
  var parts = [];
  if (p.entries && p.entries.length) {
    var avg = Math.round(p.entries.reduce(function(s,e){return s+e.price;},0) / p.entries.length);
    parts.push('持仓 ETH 均价 ~' + avg);
    if (p.stop_loss) parts.push('止损 ' + p.stop_loss);
    if (p.targets && p.targets.length) parts.push('目标 [' + p.targets.join(', ') + ']');
  } else {
    parts.push('<span class="badge-empty">空仓</span>');
  }
  if (p.history && p.history.length) {
    var totalPnl = p.history.reduce(function(s,h){return s + parseFloat(h.pnl);}, 0);
    var cls = totalPnl >= 0 ? 'pnl-pos' : 'pnl-neg';
    parts.push('累计 <span class="' + cls + '">' + (totalPnl >= 0 ? '+' : '') + totalPnl.toFixed(1) + '</span>');
    parts.push('<button class="btn-hist" onclick="toggleHist(event)">历史</button>');
  }
  document.getElementById('posWidget').innerHTML = parts.join('');
})();

window.toggleHist = function(e) {
  e.stopPropagation();
  var existing = document.getElementById('histDetail');
  if (existing) { existing.remove(); return; }
  var p = DATA.positions || {};
  if (!p.history || !p.history.length) return;
  var rows = p.history.map(function(h) {
    var exit = h.exit || (h.half_exit ? h.half_exit + (h.half_exit2 ? '/' + h.half_exit2 : '') : 'N/A');
    var pnlCls = parseFloat(h.pnl) >= 0 ? 'pnl-pos' : 'pnl-neg';
    return '<tr><td>' + h.date + '</td><td>' + h.entry + '</td><td>' + exit + '</td><td class="' + pnlCls + '">' + (parseFloat(h.pnl) >= 0 ? '+' : '') + h.pnl + '</td></tr>';
  }).join('');
  var html = '<table class="history-table"><thead><tr><th>日期</th><th>入场</th><th>出场</th><th>盈亏</th></tr></thead><tbody>' + rows + '</tbody></table>';
  var div = document.createElement('div');
  div.id = 'histDetail';
  div.style.cssText = 'position:fixed;top:56px;right:24px;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:12px 16px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,0.4);min-width:320px';
  div.innerHTML = '<div style="font-size:11px;color:#8b949e;margin-bottom:6px;font-weight:600">历史盈亏</div>' + html;
  document.body.appendChild(div);
  setTimeout(function() {
    document.addEventListener('click', function handler() {
      div.remove();
      document.removeEventListener('click', handler);
    });
  }, 0);
};

// ── sidebar: dates (newest first) ──
var dateUl = document.getElementById('dateList');
DATES.forEach(function(d) {
  var day = DATA.days[d];
  var cnt = day.type === 'log' ? day.entries.length : 'doc';
  var li = document.createElement('li');
  li.innerHTML = d.slice(5) + ' <span class="cnt">' + cnt + '</span>';
  li.onclick = function() { curDate = d; curSym = null; render(); updateActive(); };
  dateUl.appendChild(li);
});

// ── sidebar: symbols ──
var symDiv = document.getElementById('symFilters');
var ALL_SYMS = DATA.meta.symbols;

function makeChip(text, sym, isAll) {
  var span = document.createElement('span');
  span.className = 'sym-chip';
  if (isAll) {
    span.textContent = '全部';
    span.classList.add('active');
  } else {
    span.textContent = text;
    span.classList.add(SYM_CLASS[sym] || '');
  }
  span.onclick = function() {
    curSym = isAll ? null : sym;
    render();
    updateActive();
  };
  symDiv.appendChild(span);
}

makeChip('全部', null, true);
ALL_SYMS.forEach(function(s) {
  makeChip(s.replace('USDT', ''), s, false);
});

// ── search ──
var searchTimer;
document.getElementById('searchInput').oninput = function() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function() {
    searchQ = document.getElementById('searchInput').value.trim().toLowerCase();
    render();
  }, 150);
};

// ── render ──
function render() {
  var day = DATA.days[curDate];
  var content = document.getElementById('content');
  if (!day) { content.innerHTML = '<div class="empty">无数据</div>'; return; }

  // summary doc
  if (day.type === 'summary') {
    content.innerHTML = '<div class="day-header"><span class="day-dot"></span>' + curDate + ' 每日总结</div><div class="summary-doc">' + day.html + '</div>';
    updateSearchInfo(0);
    return;
  }

  // log entries — newest first
  var entries = day.entries.slice().reverse();
  if (curSym) entries = entries.filter(function(e) { return e.symbol === curSym; });
  if (searchQ) entries = entries.filter(function(e) {
    return (e.summary + e.body).toLowerCase().indexOf(searchQ) !== -1;
  });

  // group by symbol (keep insertion order = newest first)
  var groups = {};
  var symOrderSet = [];
  entries.forEach(function(e) {
    if (!groups[e.symbol]) { groups[e.symbol] = []; symOrderSet.push(e.symbol); }
    groups[e.symbol].push(e);
  });

  var html = '<div class="day-header"><span class="day-dot"></span>' + curDate + '</div>';

  if (entries.length === 0) {
    html += '<div class="empty">没有匹配的条目</div>';
  }

  // use ALL_SYMS order but only for symbols present in filtered entries
  var displayOrder = [];
  ALL_SYMS.forEach(function(s) {
    if (groups[s]) displayOrder.push(s);
  });
  // also include any symbols in entries not in ALL_SYMS (shouldn't happen)
  symOrderSet.forEach(function(s) {
    if (displayOrder.indexOf(s) === -1) displayOrder.push(s);
  });

  displayOrder.forEach(function(sym) {
    var list = groups[sym];
    if (!list || !list.length) return;
    // 全部视图：每种展示最新 2 条；单选品种：展示全部
    var showList = curSym ? list : list.slice(0, 2);
    var symClass = SYM_CLASS[sym] || '';

    html += '<div class="sym-section">';
    html += '<div class="sym-title"><span class="badge ' + SYM_BADGE[sym] + '">' + sym.replace('USDT', '') + '</span><span class="count">' + (curSym ? list.length + ' 条' : '最新') + '</span></div>';
    html += '<div class="cards-grid">';

    showList.forEach(function(e, i) {
      var bodyId = 'b' + curDate.replace(/-/g, '') + '_' + sym + '_' + i;
      var summaryText = e.summary || e.body.slice(0, 100);
      html += '<div class="card ' + symClass + '">' +
        '<div class="card-header">' +
          '<span class="card-time">' + esc(e.ts) + '</span>' +
          '<span class="card-badge ' + SYM_BADGE[sym] + '">' + sym.replace('USDT', '') + '</span>' +
          (e.period ? '<span class="card-period">周期 ' + esc(e.period) + '</span>' : '') +
        '</div>' +
        '<div class="card-summary">' + highlightText(summaryText, searchQ) + '</div>' +
        '<div class="card-body" id="' + bodyId + '">' + esc(e.body) + '</div>' +
        '<span class="card-toggle" data-target="' + bodyId + '">展开全文</span>' +
        '</div>';
    });

    html += '</div></div>';
  });

  content.innerHTML = html;
  updateSearchInfo(entries.length);

  // bind card body toggles
  var toggles = content.querySelectorAll('.card-toggle');
  for (var t = 0; t < toggles.length; t++) {
    toggles[t].onclick = function() {
      var targetId = this.getAttribute('data-target');
      var body = document.getElementById(targetId);
      if (body) {
        body.classList.toggle('expanded');
        this.textContent = body.classList.contains('expanded') ? '收起' : '展开全文';
      }
    };
  }
}

function esc(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function highlightText(text, q) {
  if (!q) return esc(text);
  var escaped = esc(text);
  var qEscaped = esc(q);
  // split on the query (case-insensitive), preserve original case in output
  var re = new RegExp('(' + qEscaped.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return escaped.replace(re, '<mark class="search-hl">$1</mark>');
}

function updateSearchInfo(n) {
  document.getElementById('searchInfo').textContent = searchQ ? '匹配 ' + n + ' 条' : '';
}

function updateActive() {
  var lis = dateUl.querySelectorAll('li');
  lis.forEach(function(li, i) {
    li.classList.toggle('active', DATES[i] === curDate);
  });
  var chips = symDiv.querySelectorAll('.sym-chip');
  chips.forEach(function(c, i) {
    if (i === 0) c.classList.toggle('active', !curSym);
    else c.classList.toggle('active', ALL_SYMS[i - 1] === curSym);
  });
}

// init
updateActive();
render();
</script>
</body>
</html>
